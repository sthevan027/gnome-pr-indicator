<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
    <title>PR Indicator</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="menu" class="popup-menu-content">
        <!-- Lista de PRs -->
        <div id="pr-view">
            <div id="sections"></div>
            <div class="refresh-row">
                <button id="refresh" class="popup-menu-item refresh-button" type="button">Atualizar agora</button>
                <button id="settings" class="settings-button" type="button" aria-label="Configurações">
                    <svg viewBox="0 0 16 16" class="icon" aria-hidden="true"><path d="M6.5 1h3l.4 2a5 5 0 0 1 1.3.7l1.9-.7 1.5 2.6-1.5 1.3a5 5 0 0 1 0 1.5l1.5 1.3-1.5 2.6-1.9-.7a5 5 0 0 1-1.3.8L9.5 15h-3l-.4-2a5 5 0 0 1-1.3-.8l-1.9.7-1.5-2.6 1.5-1.3a5 5 0 0 1 0-1.5L1.4 5.6l1.5-2.6 1.9.7A5 5 0 0 1 6.1 3zM8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z" fill-rule="evenodd"/></svg>
                </button>
            </div>
            <div id="status" class="popup-menu-item pr-indicator-empty"></div>
        </div>

        <!-- Configuração (mesma janela, troca de view — igual ao GNOME) -->
        <div id="config-view" hidden>
            <button id="back" class="popup-menu-item" type="button">← Voltar</button>

            <div class="pr-indicator-section-title">Ordem e visibilidade das seções</div>
            <div id="sections-order"></div>

            <div class="pr-indicator-section-title">O indicador acompanha</div>
            <div id="badge-options"></div>

            <div class="pr-indicator-section-title">Tema</div>
            <div id="theme-options"></div>

            <div class="pr-indicator-section-title">Autenticação</div>
            <div class="auth">
                <div id="auth-status" class="pr-indicator-empty"></div>
                <input id="token" class="pr-indicator-token-entry" type="password" spellcheck="false" autocomplete="off"
                       placeholder="Token do GitHub (escopos repo, read:org)">
                <div id="token-feedback" class="pr-indicator-empty"></div>
            </div>
        </div>
    </div>

    <script src="tray-icon.js"></script>
    <script src="popup.js"></script>
</body>
</html>
